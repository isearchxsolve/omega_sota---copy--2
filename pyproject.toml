[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-agent"
version = "1.0.0"
description = "OMEGA SOTA — Multi-domain action-taking orchestrator"
readme = "OMEGA_SOTA_ROADMAP.md"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.39.0",
    "openai>=1.50.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[project.scripts]
omega = "omega_agent.cli:main"
omega-serve = "omega_agent.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["omega_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
